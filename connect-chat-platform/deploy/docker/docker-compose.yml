# Local, fully offline stack — no cloud dependency. Run from repo root:
#   docker compose -f deploy/docker/docker-compose.yml up --build
#
# This is one of several possible deployment targets (constitution
# principle II: container/orchestrator agnostic). Nothing here is required
# for the app to run — platform-service also runs standalone with
# SPRING_PROFILES_ACTIVE=local and no other services present.

services:
  config-server:
    build:
      context: ../..
      dockerfile: deploy/docker/config-server.Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ../../config-repo:/config-repo:ro
    environment:
      CONFIG_REPO_PATH: /config-repo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

  platform-service:
    build:
      context: ../..
      dockerfile: deploy/docker/platform-service.Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      CONFIG_SERVER_URI: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
    volumes:
      - platform-service-data:/app/data

volumes:
  platform-service-data:
