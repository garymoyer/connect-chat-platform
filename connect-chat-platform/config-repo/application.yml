# Shared defaults for every service and profile, served by config-server.
# This file is the Spring Cloud Config equivalent of "application.yml" that
# every client inherits before its own <service-name>[-<profile>].yml is
# layered on top.
#
# Secrets never live here in plaintext (constitution principle III) — use
# ${SOME_SECRET} placeholders resolved by the SecretStore abstraction / the
# environment, never literal values.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 50
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 100ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 25
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
