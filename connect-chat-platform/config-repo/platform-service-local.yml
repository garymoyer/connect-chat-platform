# Local/offline dev profile overrides. Activate with SPRING_PROFILES_ACTIVE=local.
# Every value here is a local, zero-cloud-dependency default per the
# "local workload persistence" requirement.

spring:
  datasource:
    url: "jdbc:h2:file:./data/platform-service;AUTO_SERVER=TRUE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: platform-service-local
      auto-offset-reset: earliest

logging:
  level:
    com.connectchat: DEBUG
