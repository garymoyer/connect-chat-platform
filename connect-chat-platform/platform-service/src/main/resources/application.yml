spring:
  application:
    name: platform-service
  # "optional:" means the app still starts if no config-server is reachable —
  # the local profile below carries enough fallback defaults to run fully
  # offline. This is the local-persistence harness required alongside the
  # Spring Cloud Config backplane (constitution principle III).
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true

---
# Offline-fallback values for `local` profile. Authoritative copies for
# shared use live in config-repo/platform-service-local.yml served by
# config-server — these exist so a single engineer or agent sandbox never
# needs a running config-server, Kafka, or Redis just to boot the app.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: "jdbc:h2:file:./data/platform-service;AUTO_SERVER=TRUE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: platform-service-local
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.connectchat: DEBUG
